OCX 与 AI 对话导入不在此原型实现范围。\n\n## 开发\n\nnpm install\nnpm run dev -- --host 0.0.0.0 --port 4173 --strictPort\nnpm run build\n\n## 验证限制\n\n构建与打包检查通过；当前环境的预览连接错误阻止了浏览器验收，详见 design-qa.md。\n", "design-qa.md": "# Studio prototype verification\n\n- Source visual truth: /workspace/scratch/a0f6067f5606/upload/image.png\n- Source dimensions: 1487 × 1058 pixels; desktop writing-first homepage, warm white / muted purple.\n- Intended comparison viewport: 1487 × 1058 CSS px, DPR 1.\n- Implementation: http://terminal.local:4173/\n- Browser-rendered screenshot: unavailable. Browser reports upstream connect error or disconnect/reset before headers, reset reason: connection termination.\n- Preview CLI reports running; one stop/start and browser reload did not restore connectivity.\n- Full-view / focused comparison: blocked, no rendered evidence. No fidelity pass claimed.\n- Fonts: bundled subset Noto Serif CJK SC regular/bold matches editorial serif direction; user's text falls back to system CJK fonts.\n- Spacing/layout: implementation follows source sidebar, center writer, right continuation rail; unverified in browser.\n- Colors/tokens: warm white and gray-purple default; 2 base palettes × 4 accents. Unverified in browser.\n- Assets: logo extracted from user-selected source, Phosphor outline UI icons. No substitute illustration assets.\n- Copy: Chinese source homepage titles and realistic sample content retained; local-only prototype label added.\n- Interaction verification: source implemented for capture, editing, organizing, navigation, search, themes, trash/restore and text import; browser execution not verified.\n- Console errors: could not inspect application console because app never loaded.\n- Build: npm run build passed. Packaging checks: npm run test:sites passed (4 checks); these are not browser QA.\n- Delivery: self-contained downloadable HTML with embedded assets and source for local review. No deployed Site.\n\nfinal result: blocked\n", "package.json": "{\n  \"name\": \"luma-studio\",\n  \"version\": \"0.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build && node scripts/prepare-sites-build.mjs\",\n    \"preview\": \"vite preview\",\n    \"test:sites\": \"node --test tests/sites-worker.test.mjs\"\n  },\n  \"dependencies\": {\n    \"@phosphor-icons/react\": \"^2.1.10\",\n    \"@vitejs/plugin-react\": \"5.0.4\",\n    \"react\": \"19.2.0\",\n    \"react-dom\": \"19.2.0\",\n    \"vite\": \"6.4.2\"\n  }\n}\n"}</script></body></html>
